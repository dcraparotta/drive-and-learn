  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-tertiary: #1a1a25;
      --bg-elevated: #222230;
      --text-primary: #f5f5f7;
      --text-secondary: #a0a0b0;
      --text-muted: #606070;
      --accent: #00d4aa;
      --accent-dim: #00a080;
      --accent-glow: rgba(0, 212, 170, 0.3);
      --warning: #ffaa00;
      --danger: #ff4466;
      --success: #00dd88;
      --border: #2a2a3a;
      --radius: 12px;
      --radius-lg: 20px;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
    }

    body {
      font-family: 'Outfit', -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    #root {
      min-height: 100vh;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-secondary);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    @keyframes glow {
      0%, 100% { box-shadow: 0 0 20px var(--accent-glow); }
      50% { box-shadow: 0 0 40px var(--accent-glow), 0 0 60px var(--accent-glow); }
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .fade-in {
      animation: fadeIn 0.3s ease-out;
    }

    /* Button hover effects */
    button:hover:not(:disabled) {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }
    button:active:not(:disabled) {
      transform: translateY(0px) scale(0.98);
    }
    .btn-primary-glow {
      box-shadow: 0 4px 20px rgba(0, 212, 170, 0.3), 0 0 40px rgba(0, 212, 170, 0.1);
    }
    .btn-primary-glow:hover {
      box-shadow: 0 6px 28px rgba(0, 212, 170, 0.45), 0 0 50px rgba(0, 212, 170, 0.15);
    }

    /* Touch feedback */
    .touch-active {
      transform: scale(0.97);
      opacity: 0.8;
    }
  </style>
</head>

  <div id="root"></div>

  <script>
    // === PRE-BOOT SYNC ===
    // Runs before React. Checks URL params or localStorage for sync config,
    // fetches latest data from GitHub Gist, saves to localStorage, and reloads clean.
    (function() {
      var STORAGE_KEY = 'driveAndLearn_v1';
      var GIST_FILENAME = 'drive-and-learn-data.json';

      // Check URL params first (for initial phone setup)
      var params = new URLSearchParams(window.location.search);
      var urlToken = params.get('token');
      var urlGist = params.get('gist');

      // Or check localStorage for existing credentials
      var stored = null;
      try { stored = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch(e) {}
      var token = urlToken || (stored && stored.settings && stored.settings.githubToken);
      var gistId = urlGist || (stored && stored.settings && stored.settings.gistId);

      // Skip if no credentials or already synced this session
      if (!token || !gistId || sessionStorage.getItem('dl_synced')) return;
      sessionStorage.setItem('dl_synced', '1');

      // Show loading indicator
      document.getElementById('root').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0a0a0f;color:#00d4aa;font-family:sans-serif;font-size:18px;">Syncing...</div>';

      // Fetch gist and update localStorage
      fetch('https://api.github.com/gists/' + gistId, {
        headers: { 'Authorization': 'token ' + token }
      })
      .then(function(res) {
        if (!res.ok) throw new Error('Gist fetch failed: ' + res.status);
        return res.json();
      })
      .then(function(gist) {
        var file = gist.files[GIST_FILENAME];
        if (!file) throw new Error('Data file not found');
        var remote = JSON.parse(file.content);
        if (!remote || !remote.decks) throw new Error('Invalid data');

        // Merge: use remote content + preserve/set sync credentials locally
        remote.settings = remote.settings || {};
        remote.settings.githubToken = token;
        remote.settings.gistId = gistId;
        remote.settings.autoSync = true;

        localStorage.setItem(STORAGE_KEY, JSON.stringify(remote));

        // Clean URL params if present and reload
        if (urlToken || urlGist) {
          window.location.href = window.location.pathname;
        } else {
          window.location.reload();
        }
      })
      .catch(function(err) {
        console.error('Pre-boot sync failed:', err);
        // Continue loading app normally
        document.getElementById('root').innerHTML = '';
      });
    })();
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // ============ UTILITIES ============

    // Auto-chunk text into natural phrases
    const autoChunkText = (text) => {
      if (!text.trim()) return [];
      
      // Split on common phrase boundaries
      const patterns = [
        /([,;:])\s+/g,  // After punctuation
        /\s+(and|or|but|that|which|who|when|where|because|although|however|therefore|moreover|furthermore)\s+/gi,  // Conjunctions
        /\s*[-–—]\s*/g,  // Dashes
      ];
      
      let chunks = [text];
      
      patterns.forEach(pattern => {
        chunks = chunks.flatMap(chunk => {
          if (chunk.length <= 50) return [chunk];
          const parts = chunk.split(pattern).filter(p => p.trim() && p.length > 2);
          return parts.length > 1 ? parts : [chunk];
        });
      });
      
      // Further split long chunks (>60 chars) at word boundaries
      chunks = chunks.flatMap(chunk => {
        if (chunk.length <= 60) return [chunk.trim()];
        const words = chunk.split(/\s+/);
        const result = [];
        let current = [];
        let currentLen = 0;
        
        words.forEach(word => {
          if (currentLen + word.length > 50 && current.length > 0) {
            result.push(current.join(' '));
            current = [word];
            currentLen = word.length;
          } else {
            current.push(word);
            currentLen += word.length + 1;
          }
        });
        
        if (current.length) result.push(current.join(' '));
        return result;
      });
      
      return chunks.map(c => c.trim()).filter(c => c.length > 0);
    };

    // Parse recall markers from text
    const parseRecallMarkers = (text) => {
      const regex = /\*([^*]+)\*/g;
      const blanks = [];
      let match;
      while ((match = regex.exec(text)) !== null) {
        blanks.push({
          text: match[1],
          start: match.index,
          end: match.index + match[0].length
        });
      }
      return blanks;
    };

    // Get text with blanks for recall mode (supports *asterisks* and "quotes")
    const getRecallPrompt = (text) => {
      return text
        .replace(/\*([^*]+)\*/g, '[BLANK]')
        .replace(/"([^"]+)"/g, '[BLANK]');
    };

    // Get just the key facts (supports *asterisks* and "quotes")
    const getKeyFacts = (text) => {
      const asteriskMatches = text.match(/\*([^*]+)\*/g) || [];
      const quoteMatches = text.match(/"([^"]+)"/g) || [];
      return [
        ...asteriskMatches.map(m => m.replace(/\*/g, '')),
        ...quoteMatches.map(m => m.replace(/"/g, ''))
      ];
    };

    // Clean text of markers for display/speech
    const cleanText = (text) => {
      return text.replace(/\*/g, '').replace(/"/g, '');
    };

    // Format time
    const formatTime = (seconds) => {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    };

    // Generate unique ID
    const generateId = () => Math.random().toString(36).substr(2, 9);

    // ============ LOCAL STORAGE ============

    const STORAGE_KEY = 'driveAndLearn_v1';

    const loadData = () => {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          // Migration: v1 (no version field) -> v2 (folders)
          if (!parsed.version) {
            parsed.version = 2;
            parsed.folders = [];
            parsed.decks = (parsed.decks || []).map(deck => ({
              ...deck,
              folderId: null
            }));
            localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
          }
          return parsed;
        }
      } catch (e) {
        console.error('Failed to load data:', e);
      }
      return {
        version: 2,
        folders: [],
        decks: [],
        settings: {
          pauseDuration: 4,
          recallPauseDuration: 6,
          repetitions: 3,
          playbackSpeed: 1,
          selectedVoice: null,
          sessionLength: 15,
          githubToken: null,
          gistId: null,
          autoSync: true
        },
        progress: {}
      };
    };

    const saveData = (data) => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) {
        console.error('Failed to save data:', e);
      }
    };

    // ============ GITHUB GIST SYNC ============

    const GIST_FILENAME = 'drive-and-learn-data.json';

    const gistApi = {
      async createGist(token, data) {
        const res = await fetch('https://api.github.com/gists', {
          method: 'POST',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            description: 'Drive & Learn - App Data',
            public: false,
            files: { [GIST_FILENAME]: { content: JSON.stringify(data, null, 2) } }
          })
        });
        if (!res.ok) throw new Error(`Create gist failed: ${res.status}`);
        return await res.json();
      },

      async saveGist(token, gistId, data) {
        const res = await fetch(`https://api.github.com/gists/${gistId}`, {
          method: 'PATCH',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            files: { [GIST_FILENAME]: { content: JSON.stringify(data, null, 2) } }
          })
        });
        if (!res.ok) throw new Error(`Save gist failed: ${res.status}`);
        return await res.json();
      },

      async loadGist(token, gistId) {
        const res = await fetch(`https://api.github.com/gists/${gistId}`, {
          headers: { 'Authorization': `token ${token}` }
        });
        if (!res.ok) throw new Error(`Load gist failed: ${res.status}`);
        const gist = await res.json();
        const file = gist.files[GIST_FILENAME];
        if (!file) throw new Error('Data file not found in gist');
        return JSON.parse(file.content);
      }
    };

    // Strip sensitive fields before syncing to gist
    const stripSyncSecrets = (data) => {
      const { githubToken, gistId, autoSync, ...safeSettings } = data.settings;
      return { ...data, settings: safeSettings };
    };

    // ============ TTS HOOK ============

    const useTTS = () => {
      const [voices, setVoices] = useState([]);
      const [speaking, setSpeaking] = useState(false);
      const utteranceRef = useRef(null);

      useEffect(() => {
        const loadVoices = () => {
          const availableVoices = speechSynthesis.getVoices();
          // Prioritize male/deeper voices
          const sorted = availableVoices.sort((a, b) => {
            const aScore = (a.name.toLowerCase().includes('male') || a.name.toLowerCase().includes('guy') || a.name.toLowerCase().includes('david') || a.name.toLowerCase().includes('james')) ? -1 : 0;
            const bScore = (b.name.toLowerCase().includes('male') || b.name.toLowerCase().includes('guy') || b.name.toLowerCase().includes('david') || b.name.toLowerCase().includes('james')) ? -1 : 0;
            return aScore - bScore;
          });
          setVoices(sorted);
        };

        loadVoices();
        speechSynthesis.onvoiceschanged = loadVoices;

        return () => {
          speechSynthesis.cancel();
        };
      }, []);

      const speak = useCallback((text, voiceName, rate = 1) => {
        return new Promise((resolve) => {
          speechSynthesis.cancel();
          
          const utterance = new SpeechSynthesisUtterance(text);
          const voice = voices.find(v => v.name === voiceName) || voices[0];
          
          if (voice) utterance.voice = voice;
          utterance.rate = rate;
          utterance.pitch = 0.9; // Slightly lower pitch for deeper tone
          
          utterance.onend = () => {
            setSpeaking(false);
            resolve();
          };
          utterance.onerror = () => {
            setSpeaking(false);
            resolve();
          };
          
          utteranceRef.current = utterance;
          setSpeaking(true);
          speechSynthesis.speak(utterance);
        });
      }, [voices]);

      const stop = useCallback(() => {
        speechSynthesis.cancel();
        setSpeaking(false);
      }, []);

      return { voices, speak, stop, speaking };
    };

    // ============ COMPONENTS ============

    // Button Component
    const Button = ({ children, variant = 'default', size = 'md', icon, onClick, disabled, className = '', ...props }) => {
      const baseStyles = {
        display: 'inline-flex',
        alignItems: 'center',
        justifyContent: 'center',
        gap: '8px',
        border: 'none',
        borderRadius: '50px',
        cursor: disabled ? 'not-allowed' : 'pointer',
        fontFamily: 'inherit',
        fontWeight: 600,
        letterSpacing: '0.3px',
        transition: 'all 0.25s cubic-bezier(0.4, 0, 0.2, 1)',
        opacity: disabled ? 0.5 : 1,
      };

      const variants = {
        default: {
          background: 'var(--bg-tertiary)',
          color: 'var(--text-primary)',
          border: '1px solid var(--border)',
        },
        primary: {

      };

      const sizes = {
        sm: { padding: '8px 12px', fontSize: '14px' },
        md: { padding: '12px 20px', fontSize: '16px' },
        lg: { padding: '16px 28px', fontSize: '18px' },
        icon: { padding: '12px', fontSize: '16px' }
      };

      const glowClass = variant === 'primary' ? 'btn-primary-glow' : '';

      return (
        <button
          style={{ ...baseStyles, ...variants[variant], ...sizes[size] }}
          onClick={onClick}
          disabled={disabled}
          className={`${glowClass} ${className}`}
          {...props}
        >
          {icon && icon}
          {children}
        </button>
      );
    };

    // Card Component
    const Card = ({ children, onClick, style = {}, className = '' }) => (
      <div
        onClick={onClick}
        className={className}
        style={{
          background: 'var(--bg-secondary)',
          borderRadius: 'var(--radius-lg)',
          padding: '20px',
          border: '1px solid var(--border)',
          cursor: onClick ? 'pointer' : 'default',
          transition: 'all 0.2s ease',
          ...style
        }}
      >
        {children}
      </div>
    );

    // Input Component
    const Input = ({ label, ...props }) => (
      <div style={{ marginBottom: '16px' }}>
        {label && (
          <label style={{
            display: 'block',
            marginBottom: '8px',
            color: 'var(--text-secondary)',
            fontSize: '14px',
            fontWeight: 500
          }}>
            {label}
          </label>
        )}
        <input
          style={{
            width: '100%',
            padding: '12px 16px',
            background: 'var(--bg-tertiary)',
            border: '1px solid var(--border)',
            borderRadius: 'var(--radius)',
            color: 'var(--text-primary)',
            fontSize: '16px',
            fontFamily: 'inherit',
            outline: 'none',
            transition: 'border-color 0.2s'
          }}
          {...props}
        />
      </div>
    );

    // Textarea Component
    const Textarea = ({ label, ...props }) => (
      <div style={{ marginBottom: '16px' }}>
        {label && (
          <label style={{
            display: 'block',
            marginBottom: '8px',
            color: 'var(--text-secondary)',
            fontSize: '14px',
            fontWeight: 500
          }}>
            {label}
          </label>
        )}
        <textarea
          style={{
            width: '100%',
            padding: '12px 16px',
            background: 'var(--bg-tertiary)',
            border: '1px solid var(--border)',
            borderRadius: 'var(--radius)',
            color: 'var(--text-primary)',
            fontSize: '16px',
            fontFamily: 'inherit',
            outline: 'none',
            resize: 'vertical',
            minHeight: '120px',
            lineHeight: 1.6
          }}
          {...props}
        />
      </div>
    );

    // Select Component
    const Select = ({ label, options, value, onChange }) => (
      <div style={{ marginBottom: '16px' }}>
        {label && (
          <label style={{
            display: 'block',
            marginBottom: '8px',
            color: 'var(--text-secondary)',
            fontSize: '14px',
            fontWeight: 500
          }}>
            {label}
          </label>
        )}
        <select
          value={value}
          onChange={e => onChange(e.target.value)}
          style={{
            width: '100%',
            padding: '12px 16px',
            background: 'var(--bg-tertiary)',
            border: '1px solid var(--border)',
            borderRadius: 'var(--radius)',
            color: 'var(--text-primary)',
            fontSize: '16px',
            fontFamily: 'inherit',
            outline: 'none',
            cursor: 'pointer'
          }}
        >
          {options.map(opt => (
            <option key={opt.value} value={opt.value}>{opt.label}</option>
          ))}
        </select>
      </div>
    );

    // Slider Component
    const Slider = ({ label, value, onChange, min, max, step = 1, suffix = '' }) => (
      <div style={{ marginBottom: '20px' }}>
        <div style={{
          display: 'flex',
          justifyContent: 'space-between',
          marginBottom: '8px'
        }}>
          <label style={{
            color: 'var(--text-secondary)',
            fontSize: '14px',
            fontWeight: 500
          }}>
            {label}
          </label>
          <span style={{
            color: 'var(--accent)',
            fontFamily: "'JetBrains Mono', monospace",
            fontSize: '14px'
          }}>
            {value}{suffix}
          </span>
        </div>
        <input
          type="range"
          min={min}
          max={max}
          step={step}
          value={value}
          onChange={e => onChange(Number(e.target.value))}
          style={{
            width: '100%',
            height: '8px',
            borderRadius: '4px',
            background: `linear-gradient(to right, var(--accent) 0%, var(--accent) ${((value - min) / (max - min)) * 100}%, var(--bg-tertiary) ${((value - min) / (max - min)) * 100}%, var(--bg-tertiary) 100%)`,
            outline: 'none',
            cursor: 'pointer',
            WebkitAppearance: 'none'
          }}
        />
      </div>
    );

    // Modal Component
    const Modal = ({ isOpen, onClose, title, children }) => {
      if (!isOpen) return null;

      return (
        <div style={{
          position: 'fixed',
          inset: 0,
          background: 'rgba(0, 0, 0, 0.8)',
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'center',
          zIndex: 1000,
          padding: '20px'
        }} onClick={onClose}>
          <div
            className="fade-in"
            style={{
              background: 'var(--bg-secondary)',
              borderRadius: 'var(--radius-lg)',
              padding: '24px',
              maxWidth: '500px',
              width: '100%',
              maxHeight: '90vh',
              overflow: 'auto',
              border: '1px solid var(--border)'
            }}
            onClick={e => e.stopPropagation()}
          >
            <div style={{
              display: 'flex',
              justifyContent: 'space-between',
              alignItems: 'center',
              marginBottom: '20px'
            }}>
              <h2 style={{ fontSize: '20px', fontWeight: 600 }}>{title}</h2>
              <Button variant="ghost" size="icon" onClick={onClose}>
                <Icons.Close />
              </Button>
            </div>
            {children}
          </div>
        </div>
      );
    };

    // ============ MAIN APP ============

    const App = () => {
      const [data, setData] = useState(loadData);
      const [view, setView] = useState('home'); // home, folder, deck, editor, player, settings, combine
      const [currentFolder, setCurrentFolder] = useState(null);
      const [currentDeck, setCurrentDeck] = useState(null);
      const [currentItem, setCurrentItem] = useState(null);
      const [selectedDecks, setSelectedDecks] = useState([]);
      
      const [syncStatus, setSyncStatus] = useState(null); // null, 'syncing', 'success', 'error'
      const [syncMessage, setSyncMessage] = useState('');
      const syncTimeoutRef = useRef(null);
      const lastSyncedRef = useRef(null);

      // Save data whenever it changes
      useEffect(() => {
        saveData(data);
      }, [data]);

      // Auto-sync to Gist when data changes (debounced)
      useEffect(() => {
        const { githubToken, gistId, autoSync } = data.settings;
        if (!githubToken || !gistId || !autoSync) return;

        // Don't sync if data is the same as what we last synced
        const dataStr = JSON.stringify({ folders: data.folders, decks: data.decks, progress: data.progress });
        if (dataStr === lastSyncedRef.current) return;

        if (syncTimeoutRef.current) clearTimeout(syncTimeoutRef.current);
        syncTimeoutRef.current = setTimeout(async () => {
          try {
            setSyncStatus('syncing');
            await gistApi.saveGist(githubToken, gistId, stripSyncSecrets(data));
            lastSyncedRef.current = dataStr;
            setSyncStatus('success');
            setSyncMessage('Synced');
            setTimeout(() => setSyncStatus(null), 2000);
          } catch (err) {
            console.error('Auto-sync failed:', err);
            setSyncStatus('error');
            setSyncMessage('Sync failed');
            setTimeout(() => setSyncStatus(null), 4000);
          }
        }, 3000); // 3 second debounce

        return () => {
          if (syncTimeoutRef.current) clearTimeout(syncTimeoutRef.current);
        };
      }, [data]);

      // Pull from Gist (manual pull button)
      const pullFromGist = useCallback(async () => {
        const { githubToken, gistId } = data.settings;
        if (!githubToken || !gistId) return;

        try {
          setSyncStatus('syncing');
          setSyncMessage('Pulling...');
          // Clear session flag so pre-boot sync runs on reload
          sessionStorage.removeItem('dl_synced');
          window.location.reload();
        } catch (err) {
          console.error('Pull failed:', err);
          setSyncStatus('error');
          setSyncMessage('Pull failed');
          setTimeout(() => setSyncStatus(null), 4000);
        }
      }, [data.settings]);

      // Push to Gist manually
      const pushToGist = useCallback(async () => {
        const { githubToken, gistId } = data.settings;
        if (!githubToken || !gistId) return;

        try {
          setSyncStatus('syncing');
          setSyncMessage('Pushing...');
          await gistApi.saveGist(githubToken, gistId, stripSyncSecrets(data));
          const dataStr = JSON.stringify({ folders: data.folders, decks: data.decks, progress: data.progress });
          lastSyncedRef.current = dataStr;
          setSyncStatus('success');
          setSyncMessage('Pushed');
          setTimeout(() => setSyncStatus(null), 2000);
        } catch (err) {
          console.error('Push failed:', err);
          setSyncStatus('error');
          setSyncMessage('Push failed');
          setTimeout(() => setSyncStatus(null), 4000);
        }
      }, [data]);

      // Setup Gist (create new or connect existing)
      const setupGist = useCallback(async (token, existingGistId = null) => {
        try {
          setSyncStatus('syncing');
          setSyncMessage('Setting up...');

          let gistId = existingGistId;

          if (!gistId) {
            // Create new gist
            const gist = await gistApi.createGist(token, stripSyncSecrets(data));
            gistId = gist.id;
          }

          // Load remote data
          const remote = await gistApi.loadGist(token, gistId);

          if (existingGistId && remote && remote.decks && remote.decks.length > 0) {
            // Connecting to existing gist with data — save merged data and reload
            const merged = {
              ...remote,
              settings: {
                ...remote.settings,
                githubToken: token,
                gistId: gistId,
                autoSync: true
              }
            };
            saveData(merged);
            sessionStorage.setItem('dl_pulled', '1');
            window.location.reload();
            return gistId;
          } else {
            // New gist or empty existing — just save credentials
            setData(prev => ({
              ...prev,
              settings: { ...prev.settings, githubToken: token, gistId: gistId, autoSync: true }
            }));
          }

          setSyncStatus('success');
          setSyncMessage('Connected!');
          setTimeout(() => setSyncStatus(null), 2000);
          return gistId;
        } catch (err) {
          console.error('Setup failed:', err);
          setSyncStatus('error');
          setSyncMessage('Setup failed: ' + err.message);
          setTimeout(() => setSyncStatus(null), 4000);
          throw err;
        }
      }, [data]);

      // Note: pull-on-load is handled by the pre-boot script above React

      const updateSettings = (updates) => {
        setData(prev => ({
          ...prev,
          settings: { ...prev.settings, ...updates }
        }));
      };

      // Folder CRUD
      const addFolder = (name) => {
        const newFolder = {
          id: generateId(),
          name,
          deckIds: [],
          createdAt: Date.now()
        };
        setData(prev => ({
          ...prev,
          folders: [...prev.folders, newFolder]
        }));
        return newFolder;
      };

      const updateFolder = (folderId, updates) => {
        setData(prev => ({
          ...prev,
          folders: prev.folders.map(f => f.id === folderId ? { ...f, ...updates } : f)
        }));
      };

      const deleteFolder = (folderId) => {
        setData(prev => ({
          ...prev,
          folders: prev.folders.filter(f => f.id !== folderId),
          decks: prev.decks.filter(d => d.folderId !== folderId)
        }));
      };

      // Deck CRUD
      const addDeck = (name, folderId = null) => {
        const newDeck = {
          id: generateId(),
          name,
          folderId,
          items: [],
          createdAt: Date.now()
        };
        setData(prev => {
          const newData = {
            ...prev,
            decks: [...prev.decks, newDeck]
          };
          if (folderId) {
            newData.folders = prev.folders.map(f =>
              f.id === folderId
                ? { ...f, deckIds: [...f.deckIds, newDeck.id] }
                : f
            );
          }
          return newData;
        });
        return newDeck;
      };

      const updateDeck = (deckId, updates) => {
        setData(prev => ({
          ...prev,
          decks: prev.decks.map(d => d.id === deckId ? { ...d, ...updates } : d)
        }));
      };

      const deleteDeck = (deckId) => {
        setData(prev => {
          const deck = prev.decks.find(d => d.id === deckId);
          return {
            ...prev,
            decks: prev.decks.filter(d => d.id !== deckId),
            folders: deck?.folderId
              ? prev.folders.map(f =>
                  f.id === deck.folderId
                    ? { ...f, deckIds: f.deckIds.filter(id => id !== deckId) }
                    : f
                )
              : prev.folders
          };
        });
      };

      const addItem = (deckId, content) => {
        const newItem = {
          id: generateId(),
          content,
          chunks: autoChunkText(cleanText(content)),
          practiceCount: 0,
          lastPracticed: null,
          createdAt: Date.now()
        };
        setData(prev => ({
          ...prev,
          decks: prev.decks.map(d => 
            d.id === deckId 
              ? { ...d, items: [...d.items, newItem] }
              : d
          )
        }));
        return newItem;
      };

      const updateItem = (deckId, itemId, updates) => {
        setData(prev => ({
          ...prev,
          decks: prev.decks.map(d => 
            d.id === deckId 
              ? {
                  ...d,
                  items: d.items.map(i => 
                    i.id === itemId ? { ...i, ...updates } : i
                  )
                }
              : d
          )
        }));
      };

      const deleteItem = (deckId, itemId) => {
        setData(prev => ({
          ...prev,
          decks: prev.decks.map(d => 
            d.id === deckId 
              ? { ...d, items: d.items.filter(i => i.id !== itemId) }
              : d
          )
        }));
      };

      const incrementPractice = (deckId, itemId) => {
        updateItem(deckId, itemId, {
          practiceCount: (data.decks.find(d => d.id === deckId)?.items.find(i => i.id === itemId)?.practiceCount || 0) + 1,
          lastPracticed: Date.now()
        });
      };

      // Navigation
      const goHome = () => {
        setView('home');
        setCurrentFolder(null);
        setCurrentDeck(null);
        setCurrentItem(null);
      };

      const openFolder = (folder) => {
        setCurrentFolder(folder);
        setView('folder');
      };

      const openDeck = (deck) => {
        setCurrentDeck(deck);
        setView('deck');
      };

      const openEditor = (item = null) => {
        setCurrentItem(item);
        setView('editor');
      };

      const openPlayer = (mode, shuffled = false) => {
        setView('player');
      };

      // Render current view
      const renderView = () => {
        switch (view) {
          case 'home':
            return (
              <HomeView
                folders={data.folders}
                decks={data.decks}
                onOpenFolder={openFolder}
                onOpenDeck={openDeck}
                onAddFolder={addFolder}
                onAddDeck={addDeck}
                onDeleteFolder={deleteFolder}
                onDeleteDeck={deleteDeck}
                onOpenSettings={() => setView('settings')}
                onCombineDecks={() => setView('combine')}
                selectedDecks={selectedDecks}
                setSelectedDecks={setSelectedDecks}
              />
            );
          case 'folder':
            return (
              <FolderView
                folder={data.folders.find(f => f.id === currentFolder?.id)}
                decks={data.decks}
                onBack={goHome}
                onOpenDeck={openDeck}
                onAddDeck={addDeck}
                onDeleteDeck={deleteDeck}
              />
            );
          case 'deck':
            const deckData = data.decks.find(d => d.id === currentDeck?.id);
            const parentFolder = deckData?.folderId
              ? data.folders.find(f => f.id === deckData.folderId)
              : null;
            return (
              <DeckView
                deck={deckData}
                folder={parentFolder}
                onBack={() => {
                  if (parentFolder) {
                    setCurrentFolder(parentFolder);
                    setView('folder');
                  } else {
                    goHome();
                  }
                }}
                onAddItem={openEditor}
                onEditItem={(item) => openEditor(item)}
                onDeleteItem={(itemId) => deleteItem(currentDeck.id, itemId)}
                onPlay={openPlayer}
                settings={data.settings}
              />
            );
          case 'editor':
            return (
              <EditorView
                deck={data.decks.find(d => d.id === currentDeck.id)}
                item={currentItem}
                onBack={() => setView('deck')}
                onSave={(parsedItems) => {
                  if (currentItem && parsedItems.length === 1) {
                    // Editing existing item
                    updateItem(currentDeck.id, currentItem.id, {
                      content: parsedItems[0].content,
                      chunks: parsedItems[0].chunks
                    });
                  } else {
                    // Adding new items (batch)
                    parsedItems.forEach(({ content, chunks }) => {
                      const newItem = addItem(currentDeck.id, content);
                      updateItem(currentDeck.id, newItem.id, { chunks });
                    });
                  }
                  setView('deck');
                }}
              />
            );
          case 'player':
            return (
              <PlayerView
                deck={data.decks.find(d => d.id === currentDeck.id)}
                settings={data.settings}
                onBack={() => setView('deck')}
                onIncrementPractice={(itemId) => incrementPractice(currentDeck.id, itemId)}
              />
            );
          case 'settings':
            return (
              <SettingsView
                settings={data.settings}
                onUpdate={updateSettings}
                onBack={goHome}
                data={data}
                onImport={(imported) => setData(imported)}
                syncStatus={syncStatus}
                syncMessage={syncMessage}
                onSetupGist={setupGist}
                onPull={pullFromGist}
                onPush={pushToGist}
                onDisconnectSync={() => {
                  setData(prev => ({
                    ...prev,
                    settings: { ...prev.settings, githubToken: null, gistId: null, autoSync: true }
                  }));
                  lastSyncedRef.current = null;
                }}
              />
            );
          case 'combine':
            return (
              <CombineView
                decks={data.decks}
                selectedDecks={selectedDecks}
                setSelectedDecks={setSelectedDecks}
                settings={data.settings}
                onBack={goHome}
                onIncrementPractice={incrementPractice}
              />
            );
          default:
            return <HomeView decks={data.decks} onOpenDeck={openDeck} />;
        }
      };

      return (
        <div style={{ minHeight: '100vh', background: 'var(--bg-primary)' }}>
          {syncStatus && (
            <div style={{
              position: 'fixed', top: '8px', right: '12px', zIndex: 1000,
              padding: '6px 14px', borderRadius: '20px', fontSize: '12px', fontWeight: 600,
              background: syncStatus === 'syncing' ? 'var(--bg-elevated)' :
                syncStatus === 'success' ? 'rgba(0, 221, 136, 0.15)' : 'rgba(255, 68, 102, 0.15)',
              color: syncStatus === 'syncing' ? 'var(--text-secondary)' :
                syncStatus === 'success' ? 'var(--success)' : 'var(--danger)',
              border: `1px solid ${syncStatus === 'syncing' ? 'var(--border)' :
                syncStatus === 'success' ? 'rgba(0, 221, 136, 0.3)' : 'rgba(255, 68, 102, 0.3)'}`,
              animation: syncStatus === 'syncing' ? 'pulse 1.5s infinite' : 'fadeIn 0.3s ease-out'
            }}>
              {syncStatus === 'syncing' ? '⟳ ' : syncStatus === 'success' ? '✓ ' : '✗ '}{syncMessage}
            </div>
          )}
          {renderView()}
        </div>
      );
    };

    // ============ VIEWS ============

    // Folder View
    const FolderView = ({ folder, decks, onBack, onOpenDeck, onAddDeck, onDeleteDeck }) => {
      const [showNewDeck, setShowNewDeck] = useState(false);
      const [newDeckName, setNewDeckName] = useState('');

      if (!folder) return null;

      const folderDecks = folder.deckIds
        .map(id => decks.find(d => d.id === id))
        .filter(Boolean);

      const totalItems = folderDecks.reduce((sum, d) => sum + d.items.length, 0);

      const handleCreateDeck = () => {
        if (newDeckName.trim()) {
          onAddDeck(newDeckName.trim(), folder.id);
          setNewDeckName('');
          setShowNewDeck(false);
        }
      };

      return (
        <div className="fade-in" style={{ padding: '20px', maxWidth: '600px', margin: '0 auto' }}>
          <div style={{ marginBottom: '24px', paddingTop: '20px' }}>
            <Button variant="ghost" onClick={onBack} icon={<Icons.Back />} style={{ marginBottom: '16px' }}>
              Home
            </Button>
            <div style={{ display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '8px' }}>
              <div style={{ color: 'var(--warning)', fontSize: '24px' }}>
                <Icons.Folder />
              </div>
              <h1 style={{ fontSize: '24px', fontWeight: 700, color: 'var(--text-primary)' }}>
                {folder.name}
              </h1>
            </div>
            <p style={{ color: 'var(--text-muted)', fontSize: '14px' }}>
              {folderDecks.length} deck{folderDecks.length !== 1 ? 's' : ''} • {totalItems} item{totalItems !== 1 ? 's' : ''}
            </p>
          </div>

          <Button
            variant="primary"
            onClick={() => setShowNewDeck(true)}
            icon={<Icons.Plus />}
            style={{ width: '100%', marginBottom: '20px' }}
          >
            Add Deck
          </Button>

          <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
            {folderDecks.length === 0 ? (
              <Card style={{ textAlign: 'center', padding: '40px' }}>
                <Icons.Book />
                <p style={{ color: 'var(--text-muted)', marginTop: '12px' }}>
                  No decks yet. Add a deck to get started!
                </p>
              </Card>
            ) : (
              folderDecks.map((deck, index) => (
                <Card
                  key={deck.id}
                  onClick={() => onOpenDeck(deck)}
                  style={{
                    animation: `slideIn 0.3s ease-out ${index * 0.05}s both`,
                    display: 'flex',
                    alignItems: 'center',
                    gap: '16px'
                  }}
                >
                  <div style={{
                    width: '48px',
                    height: '48px',
                    borderRadius: '12px',
                    background: 'var(--bg-tertiary)',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    color: 'var(--accent)'
                  }}>
                    <Icons.Book />
                  </div>
                  <div style={{ flex: 1 }}>
                    <h3 style={{ fontSize: '18px', fontWeight: 600, marginBottom: '4px', color: 'var(--text-primary)' }}>
                      {deck.name}
                    </h3>
                    <p style={{ color: 'var(--text-muted)', fontSize: '14px' }}>
                      {deck.items.length} item{deck.items.length !== 1 ? 's' : ''}
                    </p>
                  </div>
                  <Button
                    variant="ghost"
                    size="icon"
                    onClick={(e) => {
                      e.stopPropagation();
                      if (confirm('Delete this deck?')) onDeleteDeck(deck.id);
                    }}
                  >
                    <Icons.Delete />
                  </Button>
                </Card>
              ))
            )}
          </div>

          <Modal isOpen={showNewDeck} onClose={() => setShowNewDeck(false)} title="Add Deck">
            <Input
              label="Deck Name"
              placeholder="e.g., Chapter 1: Introduction"
              value={newDeckName}
              onChange={e => setNewDeckName(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && handleCreateDeck()}
              autoFocus
            />
            <div style={{ display: 'flex', gap: '12px', marginTop: '20px' }}>
              <Button variant="default" onClick={() => setShowNewDeck(false)} style={{ flex: 1 }}>
                Cancel

      const parseItems = (raw) => {
        const blocks = raw.split(/\n\s*\n/).filter(b => b.trim());
        return blocks.map(block => {
          const lines = block.split('\n').filter(l => l.trim());
          const content = lines.join('\n');
          const chunks = lines.map(l => cleanText(l.trim()));
          return { content, chunks };
        });
      };

      const parsed = parseItems(text);
      const totalChunks = parsed.reduce((sum, p) => sum + p.chunks.length, 0);

    // Player View
    const PlayerView = ({ deck, settings, onBack, onIncrementPractice }) => {
      const [mode, setMode] = useState(null); // 'learn' or 'recall'
      const [isPlaying, setIsPlaying] = useState(false);
      const [isPaused, setIsPaused] = useState(false);
      const [currentItemIndex, setCurrentItemIndex] = useState(0);
      const [currentChunkIndex, setCurrentChunkIndex] = useState(0);
      const [repetitionCount, setRepetitionCount] = useState(0);
      const [phase, setPhase] = useState('idle'); // idle, speaking, pausing, complete
      const [sessionTime, setSessionTime] = useState(0);
      const [showBreakPrompt, setShowBreakPrompt] = useState(false);
      const [shuffledItems, setShuffledItems] = useState([]);
      const [displayText, setDisplayText] = useState('');

      const { voices, speak, stop, speaking } = useTTS();
      const timerRef = useRef(null);
      const playbackRef = useRef(null);

      // Shuffle function
      const shuffleArray = (arr) => {
        const shuffled = [...arr];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
      };

      // Session timer
      useEffect(() => {
        if (isPlaying && !isPaused) {
          timerRef.current = setInterval(() => {
            setSessionTime(prev => {
              const newTime = prev + 1;
              // Check for break prompt every 15 minutes
              if (newTime > 0 && newTime % (settings.sessionLength * 60) === 0) {
                setShowBreakPrompt(true);
                setIsPaused(true);
              }
              return newTime;
            });
          }, 1000);
        }
        return () => clearInterval(timerRef.current);
      }, [isPlaying, isPaused, settings.sessionLength]);

      // Cleanup on unmount
      useEffect(() => {
        return () => {
          stop();
          clearTimeout(playbackRef.current);
        };
      }, []);

      const items = shuffledItems.length > 0 ? shuffledItems : deck?.items || [];
      const currentItem = items[currentItemIndex];

      // Start session
      const startSession = (selectedMode, shuffle = false) => {
        setMode(selectedMode);
        if (shuffle) {
          setShuffledItems(shuffleArray(deck.items));
        } else {
          setShuffledItems([...deck.items]);
        }
        setIsPlaying(true);
        setCurrentItemIndex(0);
        setCurrentChunkIndex(0);
        setRepetitionCount(0);
        setPhase('idle');
        setSessionTime(0);
      };

      // Play next step
      const playNext = useCallback(async () => {
        if (!currentItem || isPaused) return;

        const chunks = currentItem.chunks;
        const hasRecallMarkers = currentItem.content.includes('*') || currentItem.content.includes('"');

        if (mode === 'learn') {
          // Learning mode: read all chunks with pauses, repeat N times, then next item
          for (let rep = 0; rep < settings.repetitions; rep++) {
            setRepetitionCount(rep);

            for (let c = 0; c < chunks.length; c++) {
              if (isPaused) return;
              setCurrentChunkIndex(c);

              // Speak chunk
              setPhase('speaking');
              setDisplayText(chunks[c]);
              await speak(chunks[c], settings.selectedVoice, settings.playbackSpeed);

              // Pause after chunk
              setPhase('pausing');
              setDisplayText('Repeat: ' + chunks[c]);
              await new Promise(resolve => {
                playbackRef.current = setTimeout(resolve, settings.pauseDuration * 1000);
              });
            }

            // Brief pause between repetitions
            if (rep < settings.repetitions - 1) {
              setPhase('pausing');
              setDisplayText(`Repetition ${rep + 2} of ${settings.repetitions}...`);
              await new Promise(resolve => {
                playbackRef.current = setTimeout(resolve, 1000);
              });
            }
          }

          // Done with this item, move to next
          onIncrementPractice(currentItem.id);
          if (currentItemIndex < items.length - 1) {
            setCurrentItemIndex(prev => prev + 1);
            setCurrentChunkIndex(0);
            setRepetitionCount(0);

            setDisplayText('Next item...');
            await speak('Next item', settings.selectedVoice, settings.playbackSpeed);
            await new Promise(resolve => setTimeout(resolve, 1000));
          } else {
            setPhase('complete');
            setDisplayText('Session complete!');
            await speak('Session complete. Great work!', settings.selectedVoice, settings.playbackSpeed);
            setIsPlaying(false);
            return;
          }
        } else if (mode === 'recall') {
          // Recall mode: read chunks with blanks, pause for recall, reveal answers
          if (hasRecallMarkers) {
            // Read each chunk with blanks
            for (let c = 0; c < chunks.length; c++) {
              if (isPaused) return;
              setCurrentChunkIndex(c);

              const chunkContent = currentItem.content.split('\n').filter(l => l.trim())[c] || '';
              const chunkPrompt = getRecallPrompt(chunkContent);
              const chunkAnswers = getKeyFacts(chunkContent);

              setPhase('speaking');
              setDisplayText(chunkPrompt);
              await speak(chunkPrompt.replace(/\[BLANK\]/g, '... blank ...'), settings.selectedVoice, settings.playbackSpeed);

              if (chunkAnswers.length > 0) {
                // Pause for recall
                setPhase('pausing');
                setDisplayText('Try to recall...');
                await new Promise(resolve => {
                  playbackRef.current = setTimeout(resolve, settings.recallPauseDuration * 1000);
                });

                // Reveal answer
                setPhase('speaking');
                const answerText = chunkAnswers.join(', ');
                setDisplayText('Answer: ' + answerText);
                await speak('The answer is: ' + answerText, settings.selectedVoice, settings.playbackSpeed);
                await new Promise(resolve => setTimeout(resolve, 1000));
              } else {
                // No blanks in this chunk, just pause
                setPhase('pausing');
                await new Promise(resolve => {
                  playbackRef.current = setTimeout(resolve, settings.pauseDuration * 1000);
                });
              }
            }

            // Full clean read-through
            setPhase('speaking');
            const fullText = cleanText(currentItem.content);
            setDisplayText(fullText);
            await speak(fullText.replace(/\n/g, '. '), settings.selectedVoice, settings.playbackSpeed);
            await new Promise(resolve => setTimeout(resolve, 1500));
          } else {
            // No markers, do learning mode for this item
            for (let c = 0; c < chunks.length; c++) {
              if (isPaused) return;
              setCurrentChunkIndex(c);

              setPhase('speaking');
              setDisplayText(chunks[c]);
              await speak(chunks[c], settings.selectedVoice, settings.playbackSpeed);

              setPhase('pausing');
              await new Promise(resolve => {
                playbackRef.current = setTimeout(resolve, settings.pauseDuration * 1000);
              });
            }
          }

          // Move to next item
          onIncrementPractice(currentItem.id);
          if (currentItemIndex < items.length - 1) {
            setCurrentItemIndex(prev => prev + 1);
            setCurrentChunkIndex(0);
            await new Promise(resolve => setTimeout(resolve, 1000));
          } else {
            setPhase('complete');
            setDisplayText('Session complete!');
            await speak('Session complete. Great work!', settings.selectedVoice, settings.playbackSpeed);
            setIsPlaying(false);
            return;
          }
        }
      }, [currentItem, mode, settings, isPaused, isPlaying, currentItemIndex, items.length]);

      // Start playback when playing starts or when item changes
      useEffect(() => {
        if (isPlaying && !isPaused && (phase === 'idle' || phase === 'pausing')) {
          playNext();
        }
      }, [isPlaying, isPaused, currentItemIndex]);

      // Resume playback
      const resumePlayback = () => {
        setIsPaused(false);
      };

      // Handle gestures
      const handleTap = () => {
        if (phase === 'complete') return;
        if (isPaused) {
          setIsPaused(false);
          playNext();
        } else {
          setIsPaused(true);
          stop();
          clearTimeout(playbackRef.current);
        }
      };

      const handleDoubleTap = () => {
        // Skip to next item
        stop();
        clearTimeout(playbackRef.current);
        if (currentItemIndex < items.length - 1) {
          setCurrentItemIndex(prev => prev + 1);
          setCurrentChunkIndex(0);
          setRepetitionCount(0);
        }
      };

      const handleRewind = () => {
        // Go back to previous item
        stop();
        clearTimeout(playbackRef.current);
        if (currentItemIndex > 0) {
          setCurrentItemIndex(prev => prev - 1);
          setCurrentChunkIndex(0);
          setRepetitionCount(0);
        }
      };

      const handleRepeat = () => {
        // Repeat current item
        stop();
        clearTimeout(playbackRef.current);
        setCurrentChunkIndex(0);
        setRepetitionCount(0);
        setPhase('idle');
      };

      // Mode selection screen
      if (!mode) {
        return (
          <div className="fade-in" style={{
            padding: '20px',
            maxWidth: '600px',
            margin: '0 auto',
            minHeight: '100vh',
            display: 'flex',
            flexDirection: 'column'
          }}>
            <Button variant="ghost" onClick={onBack} icon={<Icons.Back />} style={{ alignSelf: 'flex-start', marginTop: '20px' }}>
              Back
            </Button>
            
            <div style={{ flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'center', gap: '20px' }}>
              <h1 style={{ fontSize: '24px', fontWeight: 700, textAlign: 'center', marginBottom: '20px' }}>
                Select Mode
              </h1>
              
              <Card
                onClick={() => startSession('learn', false)}
                style={{ cursor: 'pointer', textAlign: 'center', padding: '30px' }}
              >
                <div style={{ color: 'var(--accent)', marginBottom: '12px' }}>
                  <Icons.Book />
                </div>
                <h3 style={{ fontSize: '20px', fontWeight: 600, marginBottom: '8px' }}>Learning Mode</h3>
                <p style={{ color: 'var(--text-muted)' }}>
                  Chunked playback with pauses for repetition. Best for new material.
                </p>
              </Card>
              
              <Card
                onClick={() => startSession('recall', false)}
                style={{ cursor: 'pointer', textAlign: 'center', padding: '30px' }}
              >
                <div style={{ color: 'var(--warning)', marginBottom: '12px' }}>
                  <Icons.Brain />
                </div>
                <h3 style={{ fontSize: '20px', fontWeight: 600, marginBottom: '8px' }}>Recall Mode</h3>
                <p style={{ color: 'var(--text-muted)' }}>
                  Prompts with blanks, pause to recall, then reveal. Best for review.
                </p>
              </Card>
              
              <Button
                variant="default"
                onClick={() => startSession('learn', true)}
                icon={<Icons.Shuffle />}
                style={{ marginTop: '12px' }}
              >
                Shuffle & Learn
              </Button>
            </div>
          </div>
        );
      }

      // Player screen
      return (
        <div
          className="fade-in"
          style={{
            minHeight: '100vh',
            display: 'flex',
            flexDirection: 'column',
            background: 'var(--bg-primary)',
            userSelect: 'none'
          }}
          onClick={handleTap}
        >
          {/* Top bar */}
          <div style={{
            padding: '20px',
            display: 'flex',
            justifyContent: 'space-between',
            alignItems: 'center'
          }} onClick={e => e.stopPropagation()}>
            <Button variant="ghost" onClick={onBack} icon={<Icons.Back />}>
              Exit
            </Button>
            <div style={{
              fontFamily: "'JetBrains Mono', monospace",
              color: 'var(--accent)',
              fontSize: '18px'
            }}>
              {formatTime(sessionTime)}
            </div>
          </div>

          {/* Progress */}
          <div style={{ padding: '0 20px' }}>
            <div style={{
              height: '4px',
              background: 'var(--bg-tertiary)',
              borderRadius: '2px',
              overflow: 'hidden'
            }}>
              <div style={{
                height: '100%',
                background: 'var(--accent)',
                width: `${((currentItemIndex + 1) / items.length) * 100}%`,
                transition: 'width 0.3s ease'
              }} />
            </div>
            <p style={{
              textAlign: 'center',
              color: 'var(--text-muted)',
              fontSize: '14px',
              marginTop: '8px'
            }}>
              {currentItemIndex + 1} of {items.length} • {mode === 'learn' ? 'Learning' : 'Recall'} Mode
            </p>
          </div>

          {/* Main display */}
          <div style={{
            flex: 1,
            display: 'flex',
            flexDirection: 'column',
            alignItems: 'center',
            justifyContent: 'center',
            padding: '40px 20px',
            textAlign: 'center'
          }}>
            {/* Status indicator */}
            <div style={{
              width: '80px',
              height: '80px',
              borderRadius: '50%',
              background: phase === 'pausing' ? 'var(--warning)' : phase === 'speaking' ? 'var(--accent)' : 'var(--bg-tertiary)',
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'center',
              marginBottom: '32px',
              animation: phase === 'speaking' ? 'pulse 1s infinite' : phase === 'pausing' ? 'glow 2s infinite' : 'none',
              transition: 'all 0.3s ease'
            }}>
              {isPaused ? (
                <Icons.Pause />
              ) : phase === 'speaking' ? (
                <Icons.Volume />
              ) : phase === 'pausing' ? (
                <Icons.Timer />
              ) : (
                <Icons.Play />
              )}
            </div>

            {/* Display text */}
            <p style={{
              fontSize: '24px',
              fontWeight: 500,
              lineHeight: 1.6,
              maxWidth: '500px',
              color: 'var(--text-primary)'
            }}>
              {displayText || (isPaused ? 'Paused - Tap to resume' : 'Starting...')}
            </p>

            {/* Phase label */}
            <p style={{
              marginTop: '20px',
              color: 'var(--text-muted)',
              fontSize: '16px'
            }}>
              {isPaused ? 'PAUSED' : phase === 'speaking' ? 'LISTENING...' : phase === 'pausing' ? 'YOUR TURN - REPEAT' : ''}
            </p>
          </div>

          {/* Controls */}
          <div style={{
            padding: '20px',
            display: 'flex',
            justifyContent: 'center',
            gap: '16px'
          }} onClick={e => e.stopPropagation()}>
            <Button variant="default" size="lg" onClick={handleRewind}>
              <Icons.Rewind />
            </Button>
            <Button variant="default" size="lg" onClick={handleRepeat}>
              <Icons.Repeat />
            </Button>
            <Button variant="default" size="lg" onClick={handleDoubleTap}>
              <Icons.Skip />
            </Button>
          </div>

          {/* Gesture hint */}
          <p style={{
            textAlign: 'center',
            color: 'var(--text-muted)',
            fontSize: '13px',
            padding: '12px 20px 30px'
          }}>
            Tap anywhere to pause/resume
          </p>

          {/* Break prompt modal */}
          <Modal
            isOpen={showBreakPrompt}
            onClose={() => {}}
            title="Time for a Break?"
          >
            <p style={{ color: 'var(--text-secondary)', marginBottom: '20px' }}>
              You've been practicing for {settings.sessionLength} minutes. Would you like to continue or take a break?
            </p>
            <div style={{ display: 'flex', gap: '12px' }}>
              <Button
                variant="default"
                onClick={() => {
                  setShowBreakPrompt(false);
                  onBack();
                }}
                style={{ flex: 1 }}
              >
                Take a Break
              </Button>
              <Button
                variant="primary"
                onClick={() => {
                  setShowBreakPrompt(false);
                  resumePlayback();
                }}
                style={{ flex: 1 }}
              >
                Continue
              </Button>
            </div>
          </Modal>
        </div>
      );
    };

    // Settings View
    const SettingsView = ({ settings, onUpdate, onBack, data, onImport, syncStatus, syncMessage, onSetupGist, onPull, onPush, onDisconnectSync }) => {
      const { voices } = useTTS();
      const fileInputRef = useRef(null);
      const [importStatus, setImportStatus] = useState(null);
      const [tokenInput, setTokenInput] = useState('');
      const [gistIdInput, setGistIdInput] = useState('');
      const [setupMode, setSetupMode] = useState(null); // null, 'new', 'existing'
      const [setupError, setSetupError] = useState(null);
      const isConnected = settings.githubToken && settings.gistId;

      const voiceOptions = voices.map(v => ({
        value: v.name,
        label: v.name + (v.lang ? ` (${v.lang})` : '')
      }));

      const handleExport = () => {
        const json = JSON.stringify(data, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `drive-and-learn-backup-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      const handleImport = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const imported = JSON.parse(event.target.result);
            if (!imported.decks || !imported.settings) {
              setImportStatus('error');
              return;
            }
            onImport(imported);
            setImportStatus('success');
            setTimeout(() => setImportStatus(null), 3000);
          } catch (err) {
            setImportStatus('error');
            setTimeout(() => setImportStatus(null), 3000);
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      return (
        <div className="fade-in" style={{ padding: '20px', maxWidth: '600px', margin: '0 auto' }}>
          <div style={{ marginBottom: '32px', paddingTop: '20px' }}>
            <Button variant="ghost" onClick={onBack} icon={<Icons.Back />} style={{ marginBottom: '16px' }}>
              Back
            </Button>
            <h1 style={{ fontSize: '24px', fontWeight: 700, color: 'var(--text-primary)' }}>Settings</h1>
            <p style={{ fontSize: '11px', color: 'var(--text-muted)', marginTop: '4px' }}>v3.0</p>
          </div>

          <Card style={{ marginBottom: '20px' }}>
            <h3 style={{ fontSize: '16px', fontWeight: 600, marginBottom: '20px', color: 'var(--accent)' }}>
              Voice Settings
            </h3>
            
            <Select
              label="TTS Voice"
              options={[{ value: '', label: 'Default' }, ...voiceOptions]}
              value={settings.selectedVoice || ''}
              onChange={v => onUpdate({ selectedVoice: v || null })}
            />

            <Slider
              label="Playback Speed"
              value={settings.playbackSpeed}
              onChange={v => onUpdate({ playbackSpeed: v })}
              min={0.5}
              max={1.5}
              step={0.1}
              suffix="x"
            />
          </Card>

          <Card style={{ marginBottom: '20px' }}>
            <h3 style={{ fontSize: '16px', fontWeight: 600, marginBottom: '20px', color: 'var(--accent)' }}>
              Learning Mode
            </h3>
            
            <Slider
              label="Pause Duration (for repetition)"
              value={settings.pauseDuration}
              onChange={v => onUpdate({ pauseDuration: v })}
              min={2}
              max={10}
              step={1}
              suffix="s"
            />

            <Slider
              label="Full Sentence Repetitions"
              value={settings.repetitions}
              onChange={v => onUpdate({ repetitions: v })}
              min={1}
              max={5}
              step={1}
              suffix="x"
            />
          </Card>

          <Card style={{ marginBottom: '20px' }}>
            <h3 style={{ fontSize: '16px', fontWeight: 600, marginBottom: '20px', color: 'var(--accent)' }}>
              Recall Mode
            </h3>
            
            <Slider
              label="Recall Pause Duration"
              value={settings.recallPauseDuration}
              onChange={v => onUpdate({ recallPauseDuration: v })}
              min={3}
              max={15}
              step={1}
              suffix="s"
            />
          </Card>

          <Card style={{ marginBottom: '20px' }}>
            <h3 style={{ fontSize: '16px', fontWeight: 600, marginBottom: '20px', color: 'var(--accent)' }}>
              Session
            </h3>

            <Slider
              label="Session Length (break reminder)"
              value={settings.sessionLength}
              onChange={v => onUpdate({ sessionLength: v })}
              min={5}
              max={30}
              step={5}
              suffix=" min"
            />
          </Card>

          <Card>
            <h3 style={{ fontSize: '16px', fontWeight: 600, marginBottom: '12px', color: 'var(--accent)' }}>
              Data
            </h3>
            <p style={{ color: 'var(--text-muted)', fontSize: '14px', marginBottom: '16px', lineHeight: 1.5 }}>
              Export your data to a JSON file, then import it on another device.
              Save the export to OneDrive to access it from your phone.
            </p>
            <div style={{ display: 'flex', gap: '12px' }}>
              <Button variant="primary" onClick={handleExport} style={{ flex: 1 }}>
                Export Data
              </Button>
              <Button variant="default" onClick={() => fileInputRef.current?.click()} style={{ flex: 1 }}>
                Import Data
              </Button>
              <input
                ref={fileInputRef}
                type="file"
                accept=".json"
                onChange={handleImport}
                style={{ display: 'none' }}
              />
            </div>
            {importStatus === 'success' && (
              <p style={{ color: 'var(--success)', fontSize: '14px', marginTop: '12px' }}>
                Data imported successfully!
              </p>
            )}
            {importStatus === 'error' && (
              <p style={{ color: 'var(--danger)', fontSize: '14px', marginTop: '12px' }}>
                Invalid file. Please select a valid Drive & Learn export.
              </p>
            )}
          </Card>

          <Card style={{ marginTop: '20px' }}>
            <h3 style={{ fontSize: '16px', fontWeight: 600, marginBottom: '12px', color: 'var(--accent)' }}>
              Cloud Sync
            </h3>

            {isConnected ? (
              <div>
                <p style={{ color: 'var(--success)', fontSize: '14px', marginBottom: '4px', fontWeight: 600 }}>
                  Connected to GitHub Gist
                </p>
                <p style={{ color: 'var(--text-muted)', fontSize: '13px', marginBottom: '16px', fontFamily: 'JetBrains Mono, monospace' }}>
                  Gist: {settings.gistId.slice(0, 12)}...
                </p>

                <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '16px' }}>
                  <span style={{ color: 'var(--text-secondary)', fontSize: '14px' }}>Auto-sync</span>
                  <button
                    onClick={() => onUpdate({ autoSync: !settings.autoSync })}
                    style={{
                      width: '44px', height: '24px', borderRadius: '12px', border: 'none', cursor: 'pointer',
                      background: settings.autoSync ? 'var(--accent)' : 'var(--bg-elevated)',
                      position: 'relative', transition: 'background 0.2s'
                    }}
                  >
                    <div style={{
                      width: '18px', height: '18px', borderRadius: '50%', background: 'white',
                      position: 'absolute', top: '3px',
                      left: settings.autoSync ? '23px' : '3px',
                      transition: 'left 0.2s'
                    }} />
                  </button>
                </div>

                <div style={{ display: 'flex', gap: '8px', marginBottom: '12px' }}>
                  <Button variant="primary" onClick={onPush} style={{ flex: 1 }} disabled={syncStatus === 'syncing'}>
                    Push
                  </Button>
                  <Button variant="default" onClick={onPull} style={{ flex: 1 }} disabled={syncStatus === 'syncing'}>
                    Pull
                  </Button>
                </div>

                <Button
                  variant="danger"
                  onClick={() => { if (confirm('Disconnect cloud sync? Your data will stay on this device.')) onDisconnectSync(); }}
                  style={{ width: '100%' }}
                >
                  Disconnect
                </Button>
              </div>
            ) : (
              <div>
                <p style={{ color: 'var(--text-muted)', fontSize: '14px', marginBottom: '16px', lineHeight: 1.5 }}>
                  Sync your data across devices using a private GitHub Gist.
                  Create content on desktop, then pull it on your phone.
                </p>

                {!setupMode ? (
                  <div style={{ display: 'flex', gap: '8px' }}>
                    <Button variant="primary" onClick={() => setSetupMode('new')} style={{ flex: 1 }}>
                      New Setup
                    </Button>
                    <Button variant="default" onClick={() => setSetupMode('existing')} style={{ flex: 1 }}>
                      Connect Existing
                    </Button>
                  </div>
                ) : (
                  <div>
                    <p style={{ color: 'var(--text-secondary)', fontSize: '13px', marginBottom: '12px', lineHeight: 1.6 }}>
                      {setupMode === 'new'
                        ? 'Paste your GitHub Personal Access Token below. Go to GitHub → Settings → Developer settings → Personal access tokens → Tokens (classic) → Generate new token. Select the "gist" scope only.'
                        : 'Paste your GitHub token and the Gist ID from your other device.'}
                    </p>

                    <input
                      type="password"
                      placeholder="GitHub Token (ghp_...)"
                      value={tokenInput}
                      onChange={e => setTokenInput(e.target.value)}
                      style={{
                        width: '100%', padding: '12px 14px', borderRadius: '10px', border: '1px solid var(--border)',
                        background: 'var(--bg-primary)', color: 'var(--text-primary)', fontSize: '14px',
                        fontFamily: 'JetBrains Mono, monospace', marginBottom: '10px', outline: 'none'
                      }}
                    />

                    {setupMode === 'existing' && (
                      <input
                        placeholder="Gist ID (e.g. abc123def456...)"
                        value={gistIdInput}
                        onChange={e => setGistIdInput(e.target.value)}
                        style={{
                          width: '100%', padding: '12px 14px', borderRadius: '10px', border: '1px solid var(--border)',
                          background: 'var(--bg-primary)', color: 'var(--text-primary)', fontSize: '14px',
                          fontFamily: 'JetBrains Mono, monospace', marginBottom: '10px', outline: 'none'
                        }}
                      />
                    )}

                    {setupError && (
                      <p style={{ color: 'var(--danger)', fontSize: '13px', marginBottom: '10px' }}>{setupError}</p>
                    )}

                    <div style={{ display: 'flex', gap: '8px' }}>
                      <Button
                        variant="primary"
                        disabled={!tokenInput || (setupMode === 'existing' && !gistIdInput) || syncStatus === 'syncing'}
                        onClick={async () => {
                          setSetupError(null);
                          try {
                            const gistId = await onSetupGist(tokenInput, setupMode === 'existing' ? gistIdInput : null);
                            setTokenInput('');
                            setGistIdInput('');
                            setSetupMode(null);
                          } catch (err) {
                            setSetupError(err.message);
                          }
                        }}
                        style={{ flex: 1 }}
                      >
                        {syncStatus === 'syncing' ? 'Connecting...' : 'Connect'}
                      </Button>
                      <Button variant="ghost" onClick={() => { setSetupMode(null); setSetupError(null); }}>
                        Cancel
                      </Button>
                    </div>
                  </div>
                )}
              </div>
            )}
          </Card>
        </div>
      );
    };

    // Combine Decks View (for playing multiple decks)
    const CombineView = ({ decks, selectedDecks, setSelectedDecks, settings, onBack, onIncrementPractice }) => {
      const [mode, setMode] = useState(null);
      const [isPlaying, setIsPlaying] = useState(false);
      
      // Combine all items from selected decks
      const combinedItems = useMemo(() => {
        const items = [];
        selectedDecks.forEach(deckId => {
          const deck = decks.find(d => d.id === deckId);
          if (deck) {
            deck.items.forEach(item => {
              items.push({ ...item, deckId });
            });
          }
        });
        return items;
      }, [selectedDecks, decks]);

      // Create a virtual deck
      const virtualDeck = {
        id: 'combined',
        name: 'Combined Session',
        items: combinedItems
      };

      const selectedDeckNames = selectedDecks
        .map(id => decks.find(d => d.id === id)?.name)
        .filter(Boolean)
        .join(', ');

      return (
        <div className="fade-in" style={{ padding: '20px', maxWidth: '600px', margin: '0 auto' }}>
          <div style={{ marginBottom: '24px', paddingTop: '20px' }}>
            <Button variant="ghost" onClick={onBack} icon={<Icons.Back />} style={{ marginBottom: '16px' }}>
              Back
            </Button>
            <h1 style={{ fontSize: '24px', fontWeight: 700, marginBottom: '8px' }}>
              Combined Session
            </h1>
            <p style={{ color: 'var(--text-muted)', fontSize: '14px' }}>
              {selectedDeckNames}
            </p>
            <p style={{ color: 'var(--text-secondary)', marginTop: '8px' }}>
              {combinedItems.length} total items
            </p>
          </div>

          <PlayerView
            deck={virtualDeck}
            settings={settings}
            onBack={onBack}
            onIncrementPractice={(itemId) => {
              const item = combinedItems.find(i => i.id === itemId);
              if (item) onIncrementPractice(item.deckId, itemId);
            }}
          />
        </div>
      );
    };

    // Render App
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
